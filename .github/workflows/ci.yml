name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rcm-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Regenerate all data, rebuild every engine, verify invariants
        run: pytest tests/ -v

  data-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the datasets
        run: |
          python data_generator/generate_claims_data.py
          python canadian/generate_activity_data.py

      - name: Gate must pass on clean data
        run: python governance/data_quality.py

      - name: Gate must close on injected corruption
        # A gate you have never watched close is decoration, so this step runs
        # the drill and fails the build if the corrupted data is *allowed*.
        #
        # Checking "did it exit non-zero" is not enough, and the reason is
        # specific: argparse also exits 2 on an unrecognised argument. Rename or
        # typo --inject-failure and the gate never runs at all, yet the step sees
        # exit 2, prints "correctly blocked", and goes green — the exact failure
        # this job exists to prevent, arriving through the back door.
        #
        # So the drill has to prove it *ran*: exit 2 AND a BLOCKED verdict on
        # stdout, which a usage error cannot produce.
        run: |
          set +e
          out=$(python governance/data_quality.py --inject-failure 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 2 ]; then
            echo "::error::expected exit 2 from the injected-failure drill, got $rc"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -q 'Verdict:.*BLOCKED'; then
            echo "::error::exit 2 but no BLOCKED verdict — the gate did not evaluate the corrupted data (renamed flag? import error?)"
            exit 1
          fi
          echo "gate correctly blocked the corrupted build"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image and run pipeline + tests inside the container
        run: |
          docker build -t rcm-analytics .
          docker run --rm rcm-analytics
